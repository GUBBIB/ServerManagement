server:
  port: 8081
spring:
  application:
    name: Server_Management
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3307/servermanagement
    driver-class-name: com.mysql.jdbc.Driver

  jpa:
    open-in-view: false
    show_sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    root: INFO

    com.github.gubbib.gubbibbank: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  access-token-expiration: 1800000 # ?? : ms