$kind: http-request
method: POST
url: "{{base_url}}/api/v1/auth/login"
examples: .resources/Login.resources/examples
order: 2000
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin1",
      "password": "aa12345!"
    }
scripts:
  - type: afterResponse
    code: |-
      // Try Authorization response header first (added in latest update), fall back to body
      const authHeader = pm.response.headers.get("Authorization");
      if (authHeader && authHeader.startsWith("Bearer ")) {
          const token = authHeader.substring(7);
          pm.collectionVariables.set("access_token", token);
          console.log("Access token saved from Authorization header.");
      } else {
          const res = pm.response.json();
          if (res.data && res.data.accessToken) {
              pm.collectionVariables.set("access_token", res.data.accessToken);
              console.log("Access token saved from response body.");
          }
      }
    language: text/javascript
