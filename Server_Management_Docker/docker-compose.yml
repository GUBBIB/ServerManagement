services:
  mysql:
    image: mysql:8.4
    container_name: servermanagement-mysql

    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: servermanagement
      MYSQL_USER: servermanagement
      MYSQL_PASSWORD: sm1234

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
